name: 강좌 데이터 수집

# 매일 새벽 한국시간 05:20 (UTC 20:20 전날).
# 도서관 접수는 대개 오전 10시에 열려서, 그 전에 한 번 훑어둡니다.
on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:          # 저장소 Actions 탭에서 손으로도 돌릴 수 있습니다
  push:
    paths:                    # 수집기를 고쳤을 때 바로 한 번 돌려 확인합니다
      - 'pohang-ontime/crawler/**'
      - '.github/workflows/crawl.yml'

permissions:
  contents: write             # 바뀐 데이터를 되돌려 커밋하기 위해 필요합니다

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # 의존성이 없어 install 단계가 필요 없습니다

      - name: 수집 실행
        working-directory: pohang-ontime
        run: node crawler/crawl.js

      - name: 바뀐 것이 있으면 커밋
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "바뀐 내용 없음 — 커밋하지 않습니다"
            exit 0
          fi
          git config user.name  "culturepick-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pohang-ontime/data/programs.json pohang-ontime/index.html
          git commit -m "Refresh program data ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          git push
