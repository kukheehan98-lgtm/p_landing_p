name: 강좌 데이터 수집

# 매일 새벽 한국시간 05:20 (UTC 20:20 전날).
# 도서관 접수는 대개 오전 10시에 열려서, 그 전에 한 번 훑어둡니다.
# ───────────────────────────────────────────────────────────────
# 2026-09-14 자동 수집을 멈췄다가 2026-09-22 운영자 판단으로 다시 켰습니다.
#
# 멈춘 이유는 포항시립도서관 robots.txt 가 `Disallow: /` 인 것을 뒤늦게
# 확인했기 때문입니다. 그 사이 09-17 에 한 번 손으로 돌렸고, 이제 매일
# 자동으로 돌아갑니다. 읽는 것은 로그인 없이 누구나 보는 공지 목록이고
# 하루 한 번인데, 그 사이트가 밝힌 의사는 여전히 그대로입니다.
# **기관에 어떤 방식이면 괜찮은지 묻는 일은 아직 남아 있습니다.**
#
# 경위는 docs/수집중단_경위기록_20260914.md 에 있습니다(공개 저장소에는
# 올리지 않습니다). 멈출 때는 아래 schedule·push 를 다시 주석 처리하면 됩니다.
# ───────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:          # 저장소 Actions 탭에서 손으로도 돌릴 수 있습니다
  push:
    paths:                    # 수집기를 고쳤을 때 바로 한 번 돌려 확인합니다
      - 'pohang-ontime/crawler/**'
      - '.github/workflows/crawl.yml'

permissions:
  contents: write             # 바뀐 데이터를 되돌려 커밋하기 위해 필요합니다

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # 의존성이 없어 install 단계가 필요 없습니다

      # 성공하든 실패하든 무슨 일이 있었는지 저장소에 남깁니다.
      # Actions 로그는 관리자만 볼 수 있어서, 기록이 없으면 원인을 알 수 없습니다.
      - name: 수집 실행
        id: crawl
        continue-on-error: true
        working-directory: pohang-ontime
        run: |
          echo "실행 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" > crawler/last-run.log
          node crawler/crawl.js 2>&1 | tee -a crawler/last-run.log

      - name: 결과와 실행 기록 커밋
        if: always()
        run: |
          LOG=pohang-ontime/crawler/last-run.log
          {
            echo "--- 만들어진 파일 ---"
            ls -la pohang-ontime/data 2>&1 || echo "data 폴더 없음"
            echo "--- 바뀐 파일 ---"
            git status --porcelain
          } >> "$LOG"

          git config user.name  "culturepick-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ 는 첫 성공 전에는 없습니다. 없는 경로를 짚으면 add 가 실패해
          # 기록조차 남지 않으므로, 폴더 전체를 넘깁니다.
          git add -A pohang-ontime
          # .gitignore 의 *.log 규칙에 걸리므로 실행 기록은 강제로 포함합니다
          git add -f "$LOG"
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음 — 커밋하지 않습니다"
          else
            git commit -m "Refresh program data ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi

      - name: 수집이 실패했으면 작업도 실패로 표시
        if: steps.crawl.outcome == 'failure'
        run: exit 1
